{% extends "base.html" %}
{% block title %}Registro{% endblock %}
{% block content %}
<main class="auth-card">
  <span class="eyebrow">CYBERSECURITY MONITORING</span>
  <h1>Crear cuenta</h1>
  <p>Registra un usuario para acceder al laboratorio.</p>
  <form method="POST">
    <label>Usuario</label><input name="usuario" minlength="4" maxlength="20" required placeholder="usuario_01">
    <label>Correo electrónico</label><input type="email" name="correo" required placeholder="usuario@correo.com">
    <label>Contraseña</label><input type="password" name="password" minlength="8" required>
    <button type="submit">Registrar</button>
  </form>
  <p>¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</main>
{% endblock %}
